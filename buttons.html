<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5: Button Styling Collection</title>
  <link rel="stylesheet" href="../styles/buttons.css">
</head>
<body>

  <h1>Task 5: Button Styling Collection</h1>
  <p>Different button styles demonstrating size, color, shape, hover, focus, and disabled states.</p>

  <section>
    <h2>1. Button Sizes</h2>
    <button class="btn small">Small Button</button>
    <button class="btn medium">Medium Button</button>
    <button class="btn large">Large Button</button>
  </section>

  <section>
    <h2>2. Button Colors</h2>
    <button class="btn primary">Primary</button>
    <button class="btn success">Success</button>
    <button class="btn danger">Danger</button>
    <button class="btn warning">Warning</button>
  </section>

  <section>
    <h2>3. Button Shapes</h2>
    <button class="btn rounded">Rounded</button>
    <button class="btn pill">Pill</button>
    <button class="btn square">Square</button>
  </section>

  <section>
    <h2>4. Hover and Focus Effects</h2>
    <button class="btn hover-effect">Hover Me</button>
    <button class="btn focus-effect">Focus Me</button>
  </section>

  <section>
    <h2>5. Gradient and Shadow Buttons</h2>
    <button class="btn gradient">Gradient Button</button>
    <button class="btn shadow">Shadow Button</button>
  </section>

  <section>
    <h2>6. Disabled Button</h2>
    <button class="btn disabled" disabled>Disabled</button>
  </section>

</body>
</html>
