<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 10: Advanced Effects Showcase</title>
  <link rel="stylesheet" href="../styles/advanced-effects.css">
</head>
<body>

  <h1 class="gradient-text">Task 10: Advanced Effects Showcase</h1>

  <section class="gradient-text-section">
    <h2 class="gradient-text">Gradient Text Effect</h2>
  </section>

  <section class="custom-inputs">
    <h2>Custom Checkboxes and Radios</h2>
    <label class="check-container">Subscribe
      <input type="checkbox" checked>
      <span class="checkmark"></span>
    </label>
    <label class="radio-container">Male
      <input type="radio" name="gender" checked>
      <span class="radiomark"></span>
    </label>
    <label class="radio-container">Female
      <input type="radio" name="gender">
      <span class="radiomark"></span>
    </label>
  </section>

  <section class="loading">
    <h2>Loading Animation</h2>
    <div class="spinner"></div>
  </section>

  <section class="text-clip">
    <h2>Text Clipping with Background Image</h2>
    <h3 class="clipped-text">UET Peshawar</h3>
  </section>

  <section class="shadow-boxes">
    <h2>Complex Shadow Effects</h2>
    <div class="shadow-card">Soft Shadow</div>
    <div class="shadow-card hard">Hard Shadow</div>
    <div class="shadow-card neon">Neon Shadow</div>
  </section>

</body>
</html>
