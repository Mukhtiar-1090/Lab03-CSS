<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 6: Form Styling</title>
  <link rel="stylesheet" href="../styles/form.css">
</head>
<body>

  <h1>Task 6: Registration Form Styling</h1>
  <p>Please fill out the form below to register.</p>

  <form class="register-form" action="#" method="post">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password">
    </div>

    <div class="form-group">
      <label for="course">Select Course</label>
      <select id="course" name="course">
        <option value="">Choose your course</option>
        <option value="web">Web Technologies</option>
        <option value="ai">Artificial Intelligence</option>
        <option value="db">Database Systems</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" name="terms"> I agree to the terms and conditions
      </label>
    </div>

    <button type="submit" class="btn">Register</button>

    <p class="success-message">Registration successful!</p>
    <p class="error-message">Please fill all required fields correctly.</p>
  </form>

</body>
</html>
